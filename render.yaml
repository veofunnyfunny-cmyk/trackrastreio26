# Configuração do Render (Blueprint).
# Ao conectar este repositório no Render como "Blueprint", ele cria/atualiza
# o serviço web automaticamente com estas configurações.
#
# Plano STARTER com DISCO PERMANENTE: as contas e vendas ficam salvas para
# sempre no disco (/var/data) e o serviço não dorme.
#
# As chaves secretas (Brevo, Roundfy) NÃO ficam aqui — cadastre no painel do
# Render em Environment (elas não vão para o GitHub).

services:
  - type: web
    name: trackrastreio26
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SESSION_SECRET
        generateValue: true      # o Render gera um segredo aleatório
      - key: NODE_VERSION
        value: "22.15.0"
      - key: DATA_DIR
        value: /var/data         # onde ficam o banco e as sessões (no disco)
    disk:
      name: dados
      mountPath: /var/data       # disco permanente montado aqui
      sizeGB: 1
